<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SDC Supply Chain Compliance Portal</title>
<style>
:root{--navy:#063a73;--navy2:#0C57A5;--acc:#0C57A5;--acc2:#1e7be0;--bg:#f2f4f8;--card:#fff;--line:#e1e6ed;--txt:#1c2633;--mut:#6b7787;
--red:#d93025;--amber:#e09b00;--green:#1e9e57;--grey:#8a949e;--purple:#7d68b8;--blue:#2a7de1}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#eef4fb,#f4f7fb) fixed;font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--txt);font-size:14px}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px}
a{color:var(--blue)}
.hidden{display:none!important}
.login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.login-hero{background:linear-gradient(135deg,#04285a 0%,#0C57A5 55%,#2f8ae8 100%);color:#fff;padding:60px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
.login-hero:after{content:"";position:absolute;right:-120px;bottom:-120px;width:420px;height:420px;border-radius:50%;border:60px solid rgba(255,255,255,.12);pointer-events:none}
.login-hero h1{font-size:40px;margin:10px 0 8px;line-height:1.1}
.login-hero p{opacity:.85;font-size:16px;max-width:460px}
.logo{display:inline-flex;align-items:center;gap:10px;font-weight:800;letter-spacing:1px}
.lg{background:#fff;padding:6px 10px;border-radius:9px;display:inline-flex;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.lg img{height:26px;display:block}.login-hero .lg img{height:40px}
.hero-feats{margin-top:30px;display:grid;gap:12px;max-width:460px}
.hero-feats div{background:rgba(255,255,255,.1);padding:12px 14px;border-radius:10px;font-size:14px}
.login-box{display:flex;align-items:center;justify-content:center;padding:30px}
.login-card{background:#fff;border-radius:16px;box-shadow:0 10px 40px rgba(15,39,66,.12);padding:32px;width:100%;max-width:420px}
.tabs{display:flex;background:var(--bg);border-radius:10px;padding:4px;margin-bottom:20px}
.tabs button{flex:1;border:0;background:none;padding:10px;border-radius:8px;font-weight:600;color:var(--mut)}
.tabs button.on{background:#fff;color:var(--navy);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.demo-hint{background:#eaf3fd;border:1px solid #b9d3f1;color:#0a4588;padding:10px 12px;border-radius:8px;font-size:12.5px;margin-top:14px}
.shell{display:flex;min-height:100vh}
.side{width:236px;min-height:100vh;background:linear-gradient(180deg,#0C57A5 0%,#073f7e 55%,#04285a 100%);color:#d6e3f3;flex-shrink:0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.side .brand{padding:18px 18px 10px;color:#fff}
.side .brand small{display:block;color:#b5cbe6;font-size:11.5px;margin-top:6px;line-height:1.35}
.side nav{flex:1;overflow:auto;padding:8px}
.side nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;color:#d6e3f3;text-decoration:none;font-size:13.5px;margin-bottom:2px}
.side nav a:hover{background:rgba(255,255,255,.09)}
.side nav a.on{background:#fff;color:var(--navy2);font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.side nav a .cnt{margin-left:auto;background:rgba(255,255,255,.2);border-radius:10px;padding:1px 8px;font-size:11.5px}
.side nav a.on .cnt{background:var(--navy2);color:#fff}
.side .me{padding:14px 16px;border-top:1px solid rgba(255,255,255,.12);font-size:12.5px}
.side .me button{margin-top:8px;width:100%;background:rgba(255,255,255,.12);color:#fff;border:0;padding:7px;border-radius:6px}
.main{flex:1;min-width:0}
.top{background:#fff;border-bottom:1px solid var(--line);padding:14px 26px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
.top h2{margin:0;font-size:19px}
.top .sp{flex:1}
.top .today{color:var(--mut);font-size:12.5px}
.bell{position:relative;border:1px solid var(--line);background:#fff;border-radius:50%;width:36px;height:36px;font-size:16px}
.bell span{position:absolute;top:-5px;right:-5px;background:var(--red);color:#fff;border-radius:10px;font-size:10.5px;padding:1px 6px;font-weight:700}
.content{padding:22px 26px 60px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:18px}
.kpi{background:#fff;border-radius:12px;padding:16px;border:1px solid var(--line);position:relative;cursor:pointer;transition:.15s}
.kpi:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.06)}
.kpi .n{font-size:30px;font-weight:800;line-height:1}
.kpi .l{color:var(--mut);font-size:12.5px;margin-top:6px}
.kpi:before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:4px;border-radius:0 4px 4px 0;background:var(--c,var(--navy))}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px}
.card h3{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 .sp{flex:1}
.list-item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:0}
.list-item .grow{flex:1;min-width:0}
.list-item .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-item .s{color:var(--mut);font-size:12.5px}
.empty{color:var(--mut);padding:16px;text-align:center;font-size:13px}
.pill{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:600;white-space:nowrap}
.p-red{background:#fde8e7;color:var(--red)}.p-amber{background:#fff4d6;color:#9a6a00}.p-green{background:#e3f5ea;color:#167a43}
.p-grey{background:#eceff2;color:#5d6670}.p-purple{background:#eee9f8;color:var(--purple)}.p-blue{background:#e4effc;color:#1d64b8}
.btn{border:1px solid var(--line);background:#fff;color:var(--txt);padding:7px 13px;border-radius:8px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.btn:hover{background:#f7f9fb}
.btn.pri{background:linear-gradient(135deg,#1e7be0,#0C57A5);border-color:#0C57A5;color:#fff}.btn.pri:hover{background:#0a4a8f}
.banner .btn.pri{background:#fff;color:#0C57A5;border-color:#fff}
.btn.ok{background:var(--green);border-color:var(--green);color:#fff}
.btn.warn{background:#fff;border-color:var(--amber);color:#9a6a00}
.btn.bad{background:var(--red);border-color:var(--red);color:#fff}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.ghost{border-color:transparent;background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar input,.toolbar select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
.toolbar .sp{flex:1}
.tbl-wrap{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:auto}
table{width:100%;border-collapse:collapse}
th{background:#f6f8fb;text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.3px;color:var(--mut);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.click:hover td{background:#fafbfd;cursor:pointer}
tr.sec td{background:#eef2f7;font-weight:700;color:var(--navy2);font-size:12.5px}
tr.dim td{opacity:.6}
td input.inl{padding:5px 7px;border:1px solid transparent;border-radius:6px;background:transparent;width:100%;min-width:110px}
td input.inl:hover,td input.inl:focus{border-color:#cfd6df;background:#fff}
.mut{color:var(--mut)}.small{font-size:12px}
.tag{display:inline-block;background:#eef2f7;color:var(--navy2);padding:2px 7px;border-radius:5px;font-size:11px;font-weight:600}
.sample{background:#fff1e6;color:#b4541b}
.bar{height:8px;background:#edf0f4;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px}
.ring{width:130px;height:130px;border-radius:50%;display:grid;place-items:center;margin:auto}
.ring div{width:100px;height:100px;border-radius:50%;background:#fff;display:grid;place-items:center;text-align:center}
.ring b{font-size:28px;display:block}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .dh{font-size:12px;color:var(--mut);font-weight:700;text-align:center;padding:4px}
.cal .d{background:#fff;border:1px solid var(--line);border-radius:8px;min-height:104px;padding:6px;font-size:11.5px;overflow:hidden}
.cal .d.o{opacity:.45}.cal .d.t{border:2px solid var(--acc2)}
.cal .d .dn{font-weight:700;font-size:12px;margin-bottom:4px}
.cal .ev{display:block;padding:2px 5px;border-radius:4px;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.modal{position:fixed;inset:0;background:rgba(10,25,45,.5);display:flex;align-items:flex-start;justify-content:center;z-index:50;overflow:auto;padding:30px 16px}
.modal-card{background:#fff;border-radius:14px;width:100%;max-width:760px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal-card.wide{max-width:980px}.modal-card.xwide{max-width:1180px}
.mh{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mh h3{margin:0;font-size:17px;flex:1}
.mb{padding:20px 22px;max-height:calc(100vh - 200px);overflow:auto}
.mf{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fld{display:flex;flex-direction:column;gap:5px}
.fld.full{grid-column:1/-1}
.fld>span{font-size:12.5px;font-weight:600;color:#3b4756}
.fld input,.fld select,.fld textarea{padding:9px 10px;border:1px solid #cfd6df;border-radius:8px;background:#fff;width:100%}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:2px solid #bcd8f6;border-color:var(--acc)}
.req{color:var(--red)}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.chk{background:#f4f6f9;border:1px solid var(--line);padding:6px 10px;border-radius:20px;font-size:12.5px;display:flex;gap:6px;align-items:center;cursor:pointer}
.chk:has(input:checked){background:#e6f0fb;border-color:var(--acc)}
.declare{flex-direction:row!important;align-items:flex-start;background:#f6f8fb;padding:12px;border-radius:8px;font-size:13px;gap:10px}
.declare input{width:auto!important;flex-shrink:0;margin-top:3px}
.declare:has(input:checked){background:#e3f5ea}
.dl{display:grid;grid-template-columns:200px 1fr;gap:8px 16px;font-size:13.5px}
.dl dt{color:var(--mut);font-weight:600}.dl dd{margin:0;white-space:pre-wrap}
.thread{display:flex;flex-direction:column;gap:10px}
.msg{padding:10px 12px;border-radius:10px;background:#f4f6f9;max-width:85%}
.msg.me{align-self:flex-end;background:#e6f0fb}
.msg .who{font-size:11.5px;color:var(--mut);margin-bottom:3px}
.typecards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.typecard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;cursor:pointer;transition:.15s}
.typecard:hover{border-color:var(--acc);transform:translateY(-2px)}
.typecard .ic{font-size:26px}.typecard b{display:block;margin:6px 0 4px}
.typecard small{color:var(--mut)}
.banner{background:linear-gradient(120deg,#04285a 0%,#0C57A5 55%,#2f8ae8 100%);color:#fff;border-radius:14px;padding:20px 22px;margin-bottom:18px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.banner h2{margin:0 0 4px}.banner p{margin:0;opacity:.88}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.step{font-size:11.5px;padding:3px 8px;border-radius:12px;background:#eef2f7;color:var(--mut)}
.step.done{background:#e3f5ea;color:#167a43}.step.cur{background:#e4effc;color:#1d64b8;font-weight:700}
.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
.flow div{background:rgba(255,255,255,.12);border-radius:10px;padding:10px 12px;font-size:12.5px}
.flow b{display:block;font-size:13.5px;margin-bottom:2px}
.xl-head{background:#BDD7EE;padding:14px 18px;font-size:24px;font-weight:700;text-align:center;color:#0f2742}
/* review sheet */
.rs-head{display:flex;align-items:center;gap:16px;border-bottom:3px solid var(--navy2);padding-bottom:10px;margin-bottom:14px}
.rs-head img{height:44px}.rs-head h2{margin:0;font-size:19px;color:var(--navy)}
.rs table td,.rs table th{padding:7px 9px;font-size:13px}
.rs tr.sh td{background:linear-gradient(90deg,#0C57A5,#2f8ae8);color:#fff;font-weight:700;font-size:13px}
.rs td.it{width:46%}
.yn{display:inline-flex;border:1px solid #cfd6df;border-radius:8px;overflow:hidden}
.yn label{padding:5px 10px;font-size:12px;font-weight:700;cursor:pointer;color:#5d6670;border-right:1px solid #cfd6df}
.yn label:last-child{border-right:0}
.yn input{display:none}
.yn label:has(input[value=Y]:checked){background:var(--green);color:#fff}
.yn label:has(input[value=N]:checked){background:var(--red);color:#fff}
.yn label:has(input[value=NA]:checked){background:#8a949e;color:#fff}
.ans{display:inline-block;min-width:34px;text-align:center;border-radius:6px;padding:3px 6px;font-weight:700;font-size:12px;color:#fff}
.ans.Y{background:var(--green)}.ans.N{background:var(--red)}.ans.NA{background:#8a949e}.ans.x{background:#eceff2;color:#99a}
.rs input.c{width:100%;padding:5px 8px;border:1px solid #dfe5ec;border-radius:6px}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat label{border:2px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;font-size:12.5px}
.stat label b{font-size:22px;display:block;margin-bottom:4px}
.stat label:has(input:checked){border-color:var(--acc);background:#e6f0fb}
.stat input{display:none}
.rednote{color:var(--red);font-weight:700;font-size:12.5px;border:1px solid #f6c2bf;background:#fff5f4;padding:10px;border-radius:8px}
.sigpad{width:100%;height:150px;border:2px dashed #b9c3cf;border-radius:10px;background:#fff;touch-action:none;display:block}
.op-top{background:linear-gradient(120deg,#04285a,#0C57A5);color:#fff;padding:14px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.op-top small{opacity:.75}
.op-wrap{max-width:780px;margin:0 auto;padding:18px 14px 80px}
.op-step{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
.op-step h2{margin:0 0 10px;font-size:18px;display:flex;align-items:center;gap:10px}
.op-num{width:30px;height:30px;border-radius:50%;background:var(--acc2);color:#fff;display:inline-grid;place-items:center;font-size:15px;flex-shrink:0}
.op-step.done .op-num{background:var(--green)}
.vid{position:relative;padding-top:56.25%;border-radius:10px;overflow:hidden;background:#000;margin-bottom:12px}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.rams-box{border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px;background:#fbfcfe}
.rams-box h4{margin:0 0 10px}
.rules{margin:0 0 12px;padding-left:20px}.rules li{margin-bottom:4px}
.big-ok{font-size:64px;text-align:center}
.note{display:flex;gap:10px;padding:11px 6px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:8px}
.note:hover{background:#f6f9fd}.note.un{background:#eef5fd}.note.un b{color:var(--navy2)}
.pstage{border:1px solid var(--line);border-radius:12px;margin-bottom:14px;overflow:hidden;background:#fff}
.pstage-h{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#f3f6fa;font-weight:700;color:var(--navy)}
.pstage.cur{border:2px solid var(--acc2);box-shadow:0 4px 16px rgba(12,87,165,.12)}.pstage.cur .pstage-h{background:linear-gradient(90deg,#0C57A5,#2f8ae8);color:#fff}
.pstage.done .pstage-h{background:#e3f5ea;color:#167a43}.pstage.future{opacity:.55}.pstage .form{padding:14px}.pstage-h .sp{flex:1}
.pnum{width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.08);display:inline-grid;place-items:center;font-size:12px}.pstage.cur .pnum{background:#fff;color:var(--navy2)}
.ph{grid-column:1/-1;background:#0C57A5;color:#fff;font-weight:700;padding:7px 10px;border-radius:6px;margin-top:6px}.psub{grid-column:1/-1;font-weight:700;color:var(--navy2);border-bottom:1px solid var(--line);padding-bottom:3px}
.pnote{grid-column:1/-1;font-size:12.5px;color:#3b4756;background:#f6f8fb;padding:9px 11px;border-radius:8px}.pnote.red{color:var(--red);font-weight:700;background:#fff5f4}
.pyn{grid-column:1/-1;display:grid;grid-template-columns:1fr 380px;gap:10px;align-items:center;border-bottom:1px dashed var(--line);padding:6px 0}.pq{font-size:13px}.pyn-a{display:flex;gap:8px;align-items:center}
.pc{flex:1;padding:6px 8px;border:1px solid #dfe5ec;border-radius:6px;width:100%}.ptick{grid-column:1/-1;font-size:13px}.pv{padding:7px 0;font-size:13.5px}
.psig{margin:0 14px 14px;border:1px dashed #b9c3cf;border-radius:10px;padding:10px 12px}.psig.edit{border-color:var(--acc2);background:#f7fbff}.psig-h{font-weight:700;color:var(--navy)}
.psig-g{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:6px;font-size:13px}.prows td{padding:4px 6px}
.chk input{width:auto!important;margin:0}
.ofgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.ofcard{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;transition:.15s}
.ofcard:hover{border-color:#f59a2b}.ofcard.on{border:2px solid #e06a00;background:#fff8f0}
.ofn{width:30px;height:30px;border-radius:8px;background:#e06a00;color:#fff;display:grid;place-items:center;font-weight:800;flex-shrink:0}
.k-launch{display:flex;align-items:center;gap:12px;background:#fff;color:var(--navy);padding:14px 16px;border-radius:12px;text-decoration:none;font-weight:700;margin-top:22px;max-width:460px;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.k-launch small{display:block;font-weight:400;color:var(--mut)}
body.kiosk{background:#eef3fa;font-size:17px}
.k-top{background:linear-gradient(120deg,#04285a,#0C57A5 60%,#2f8ae8);color:#fff;padding:14px 22px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:5}
.k-top .lg img{height:34px}.k-who{background:rgba(255,255,255,.18);padding:8px 14px;border-radius:20px;font-weight:700}
.k-exit{background:rgba(255,255,255,.15);color:#fff;border:0;padding:10px 16px;border-radius:10px;font-size:15px}
.k-wrap{max-width:1100px;margin:0 auto;padding:22px 18px 80px}
.k-h{font-size:28px;margin:6px 0 16px;color:var(--navy)}.k-h2{font-size:20px;margin:26px 0 12px;color:var(--navy2)}
.k-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.k-tile{background:#fff;border:2px solid #d6e2f0;border-radius:18px;padding:22px 16px;min-height:130px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:17px;text-align:center;box-shadow:0 3px 10px rgba(12,87,165,.06)}
.k-tile:active{transform:scale(.97)}.k-tile small{color:var(--mut);font-size:13px}.k-tile.dim{opacity:.55}.k-tile.of{border-color:#f7c58d;background:#fffaf4}
.k-ic{font-size:40px;line-height:1}
.k-list{display:flex;flex-direction:column;gap:10px}
.k-row{display:flex;align-items:center;gap:14px;background:#fff;border:2px solid #d6e2f0;border-radius:14px;padding:16px;font-size:17px}.k-row small{display:block;color:var(--mut);font-size:13.5px;margin-top:2px}
.k-input{width:100%;padding:16px;font-size:20px;border:2px solid #cfd6df;border-radius:14px;margin-bottom:16px}
.k-btn{background:linear-gradient(135deg,#1e7be0,#0C57A5);color:#fff;border:0;padding:20px 30px;border-radius:16px;font-size:20px;font-weight:700;min-width:240px}
.k-btn.ghost{background:#fff;color:var(--navy2);border:2px solid #b9d3f1}
.k-back{background:#fff;border:2px solid #d6e2f0;border-radius:12px;padding:12px 16px;font-size:16px}
.k-card{background:#fff;border-radius:20px;padding:30px;box-shadow:0 10px 30px rgba(12,87,165,.1);max-width:720px;margin:20px auto}
.k-thanks{text-align:center}.k-thanks h1{font-size:34px;margin:6px 0;color:var(--navy)}.k-thanks h2{font-size:24px;color:var(--navy2)}.k-thanks p{font-size:18px}
body.kiosk .modal{padding:0}body.kiosk .modal-card{max-width:none!important;border-radius:0;min-height:100vh}
body.kiosk .mb{max-height:calc(100vh - 150px)}body.kiosk .fld input,body.kiosk .fld select,body.kiosk .fld textarea,body.kiosk .pc{font-size:17px;padding:13px}
body.kiosk .yn label{padding:12px 18px;font-size:16px}body.kiosk .chk{padding:11px 15px;font-size:15px}body.kiosk .declare{font-size:16px;padding:16px}body.kiosk .declare input{width:24px!important;height:24px}
body.kiosk .mf .btn{padding:16px 22px;font-size:17px}body.kiosk .sigpad{height:180px!important;max-width:none!important}body.kiosk .pyn{grid-template-columns:1fr}body.kiosk .pq{font-size:16px}
@media(max-width:900px){.pyn{grid-template-columns:1fr}.psig-g{grid-template-columns:1fr 1fr}}
.ss-intro{font-size:14px;color:#3b4756;background:#eef6f4;border-radius:10px;padding:12px 14px;margin:6px 0 14px}
.ss-item{border:2px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px;background:#fff}
.ss-item.good{border-color:#9ad6b2;background:#f4fbf6}.ss-item.bad{border-color:#f2a8a2;background:#fff6f5}
.ss-head{display:flex;gap:14px;align-items:flex-start}.ss-num{width:34px;height:34px;border-radius:50%;background:#00897b;color:#fff;display:grid;place-items:center;font-weight:800;flex-shrink:0;font-size:16px}
.ss-txt{flex:1}.ss-t{font-weight:700;font-size:16px;color:#0f2742}.ss-g{font-size:14px;line-height:1.45;color:#2d3a4a;margin-top:4px}
.ss-act{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0 8px 48px}
.ss-ok,.ss-no,.ss-cam{border:2px solid #cfd6df;background:#fff;border-radius:12px;padding:12px 20px;font-size:16px;font-weight:700;cursor:pointer;min-width:110px;text-align:center}
.ss-ok.on{background:var(--green);border-color:var(--green);color:#fff}.ss-no.on{background:var(--red);border-color:var(--red);color:#fff}
.ss-cam{background:#0C57A5;border-color:#0C57A5;color:#fff;display:inline-flex;align-items:center;gap:6px}
.ss-c{margin-left:48px;width:calc(100% - 48px);padding:11px 12px;border:1px solid #cfd6df;border-radius:10px;font-size:15px}
.ss-thumbs{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 0 48px}.ss-th{position:relative;display:inline-block}.ss-th img{height:84px;border-radius:8px;border:1px solid var(--line)}
.ss-th button{position:absolute;top:2px;right:2px;border:0;background:rgba(0,0,0,.6);color:#fff;border-radius:50%;width:24px;height:24px}
.ss-res{margin:10px 0 0 48px;font-weight:600}.ss-sign{border:2px dashed #b9c3cf;border-radius:14px;padding:14px 16px;margin-top:6px}
.k-launch.safe{margin-top:10px;background:#e8f7f3;border:2px solid #4db6ac}
@media(max-width:700px){.ss-act,.ss-c,.ss-thumbs,.ss-res{margin-left:0;width:100%}}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 18px;border-radius:10px;font-size:13.5px;opacity:0;transition:.25s;pointer-events:none;z-index:99}
#toast.show{opacity:1}
#toast.err{background:var(--red)}
@media(max-width:900px){
 .login{grid-template-columns:1fr}.login-hero{padding:30px}.login-hero h1{font-size:28px}
 .shell{flex-direction:column}.side{width:100%;height:auto;min-height:0;position:relative}
 .side nav{display:flex;overflow-x:auto}.side nav a{white-space:nowrap}
 .g2,.g3,.flow,.stat{grid-template-columns:1fr}.form{grid-template-columns:1fr}.dl{grid-template-columns:1fr}
 .content{padding:16px}
}
@media print{.side,.top button,.toolbar,.btn{display:none!important}.content{padding:0}.tbl-wrap{border:0}td input.inl{border:0}}
</style>

 }
 const all={...d.permit.vals,...vals};

function ofDrawing(id){const x=id?OFD().drawings.find(d=>d.id===id):{status:'Current',issuedTo:[]};
 openModal(`<div class="mh"><h3>🛰️ ${id?'Edit':'Upload'} GPR survey / utilities drawing</h3><button class="btn ghost" onclick="closeModal()">✕</button></div><div class="mb"><div class="form">
 <label class="fld full"><span>Title *</span><input id="dwT" value="${esc(x.title||'')}" placeholder="e.g. 2D Underground Services Survey"></label>
 <label class="fld"><span>Drawing no. *</span><input id="dwN" value="${esc(x.no||'')}"></label><label class="fld"><span>Revision *</span><input id="dwR" value="${esc(x.rev||'')}"></label>
 <label class="fld"><span>Produced by *</span><input id="dwB" value="${esc(x.by||'')}" placeholder="Survey company / utility"></label><label class="fld"><span>Date of survey / produced *</span><input type="date" id="dwD" value="${esc(x.date||'')}"></label>
 <label class="fld"><span>Survey type / quality level</span><input id="dwY" value="${esc(x.type||'')}" placeholder="e.g. PAS 128:2022 Type B M2"></label><label class="fld"><span>Status</span><select id="dwS">${['Current','Superseded'].map(s=>`<option ${x.status===s?'selected':''}>${s}</option>`).join('')}</select></label>
 <label class="fld full"><span>Drawing file${id?' (leave blank to keep)':' *'}</span><input type="file" id="dwF" accept=".pdf,image/*,.dwg"></label>
 <div class="fld full"><span>Issue to subcontractors (they must confirm receipt)</span><div class="checks">${S.subs.map(s=>`<label class="chk"><input type="checkbox" name="dwI" value="${s.id}" ${(x.issuedTo||[]).includes(s.id)?'checked':''}>${esc(s.name)}</label>`).join('')||'<span class="mut small">No subcontractors yet</span>'}</div></div></div></div>
 <div class="mf">${id?`<button class="btn bad" style="margin-right:auto" onclick="if(confirm('Delete this drawing?')){S.of.drawings=S.of.drawings.filter(d=>d.id!=='${id}');save();closeModal();render()}">Delete</button>`:''}<button class="btn" onclick="closeModal()">Cancel</button><button class="btn pri" onclick="ofDrawingSave('${id||''}')">Save & issue</button></div>`)}
async function ofDrawingSave(id){const o=OFD();let x=id?o.drawings.find(d=>d.id===id):null;
 const vals={title:$('dwT').value.trim(),no:$('dwN').value.trim(),rev:$('dwR').value.trim(),by:$('dwB').value.trim(),date:$('dwD').value,type:$('dwY').value.trim(),status:$('dwS').value,issuedTo:[...document.querySelectorAll('input[name=dwI]:checked')].map(e=>e.value)};
 if(!vals.title||!vals.no||!vals.rev||!vals.by||!vals.date)return toast('Fill in title, drawing no., revision, produced by and date','err');
 const fl=$('dwF').files[0];if(!x&&!fl)return toast('Attach the drawing file','err');
 if(!x){x={id:uid(),ack:{},added:iso(TODAY()),addedBy:U.name};o.drawings.push(x);
  o.drawings.filter(d=>d!==x&&d.no===vals.no&&d.status!=='Superseded').forEach(d=>{d.status='Superseded'})}
 const before=x.issuedTo||[];Object.assign(x,vals);if(fl)x.file={name:fl.name,size:fl.size,data:await fileToData(fl)};
 if(fl&&id)x.ack={};
 x.issuedTo.filter(s=>fl||!before.includes(s)).forEach(s=>notify(s,`SDC issued service drawing ${x.no} rev ${x.rev} – confirm receipt in the Orange Folder`,"go('sof')",'🛰️'));
 audit(`Orange Folder drawing ${x.no} rev ${x.rev} ${id?'updated':'issued'}`);save();closeModal();render();toast('Drawing saved'+(x.issuedTo.length?' – subcontractors notified':''))}
function ofAck(id){const x=OFD().drawings.find(d=>d.id===id);const n=prompt('Your name – confirming you have received this drawing and issued it to the dig team:');if(!n)return;
 (x.ack=x.ack||{})[U.subId]={name:n,date:iso(TODAY())};notify('sdc',`${sub(U.subId).name} confirmed receipt of drawing ${x.no} rev ${x.rev}`,"F.of=2;go('of')",'✅');audit(`Drawing ${x.no} rev ${x.rev} received by ${n}`);save();render();toast('Receipt confirmed – SDC notified')}

 ${isS?`<label class="fld full"><span>Subcontractor *</span><select id="cgU">${S.subs.map(s=>`<option value="${s.id}" ${old.subId===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></label>`:''}

 if(!x.subId||!x.model||!x.serial||!x.cal||!x.due||!fl)return toast('Fill in every field and attach the certificate','err');

function ofExEntry(id){const r=OFD().exreg.find(x=>x.id===id);const now=new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,16);
 openModal(`<div class="mh"><h3>🕳️ Excavation inspection – ${esc(r.location)}</h3><button class="btn ghost" onclick="closeModal()">✕</button></div><div class="mb">

 if(!e.dt||!e.loc||!e.concern||!e.by)return toast('Fill in date/time, location, concerns (or tick no concerns) and your name','err');if(!signed('eeSig'))return toast('Please sign','err');
 e.sig=$('eeSig').toDataURL('image/png');const ph=$('eeP').files[0];if(ph)e.photo=await shrinkImg(ph);(r.entries=r.entries||[]).push(e);
 if(!e.ok||e.further)notify('sdc',`⚠️ ${sub(r.subId).name}: excavation concern at ${e.loc} – ${e.concern.slice(0,80)}`,`F.of=6;go('of');setTimeout(()=>ofExOpen('${r.id}'),50)`,'🕳️');

function ofExOpen(id){const r=OFD().exreg.find(x=>x.id===id);

 <dl class="dl" style="grid-template-columns:150px 1fr 150px 1fr"><dt>Project</dt><dd>${esc(S.project.name)}</dd><dt>Subcontractor</dt><dd>${esc(sub(r.subId).name)}</dd><dt>Inspection manager</dt><dd>${esc(r.manager)} ${r.sig?`<img src="${r.sig}" style="height:30px;vertical-align:middle">`:''}</dd><dt>Supports</dt><dd>${esc(r.support||'')}</dd>${r.pbg?`<dt>Permit</dt><dd>${esc((S.docs.find(d=>d.id===r.pbg)||{permit:{}}).permit.no||'')}</dd>`:''}</dl>

 desc:{l:'Description of equipment',req:1,w:'full'},

 ladder:{name:'Ladders & stepladders',short:'Ladder',icon:'🪜',insp:'Ladder inspection',freq:7,photoReq:1,photoL:'Photo of ladder tag',fields:['desc','idMark','location','onDate','offDate'],ph:'e.g. 6-tread swingback stepladder'},

function eqOn(e){return !e.offDate||daysTo(e.offDate)>0}
function subOn(id){const s=sub(id);return !id||(s&&s.site==='on site')}
function eqLastInsp(e){return S.insp.filter(i=>i.cls===e.cls&&i.rows.some(r=>r.eqId===e.id)).map(i=>i.date).sort().slice(-1)[0]||''}
function eqLastRow(e){const l=S.insp.filter(i=>i.cls===e.cls&&i.rows.some(r=>r.eqId===e.id)).sort((a,b)=>a.date.localeCompare(b.date)).slice(-1)[0];return l&&l.rows.find(r=>r.eqId===e.id)}
function certSt(e){if(!e.expiry)return '';const k=daysTo(e.expiry);return k<0?'expired':k<=30?'expiring':''}
function eqStatus(e){
 if(!eqOn(e))return 'offsite';if(!subOn(e.subId))return 'notonsite';
 const c=certSt(e);if(c==='expired')return 'expired';
 const r=eqLastRow(e);if(r&&r.result==='Bad order')return 'defect';
 const l=eqLastInsp(e);const st=l?dueStatus(addDays(l,EQ_CLS[e.cls].freq),2):'never';
 return c==='expiring'&&st==='indate'?'expiring':st}
function eqNext(e){const l=eqLastInsp(e);return l?addDays(l,EQ_CLS[e.cls].freq):''}
function eqNo(cls){return EQ_CLS[cls].short.slice(0,3).toUpperCase()+'-'+String(S.eq.filter(e=>e.cls===cls).length+1).padStart(3,'0')}
function eqGo(cls){return cls==='lift'?"go('lifting')":cls==='scaffold'?"F.twt='scaf';go('tw')":"go('equip')"}

 const c=EQ_CLS[cls],e=id?S.eq.find(x=>x.id===id):{};const isS=U.kind==='sdc';
 openModal(`<div class="mh"><h3>${c.icon} ${id?'Edit':'Add'} – ${esc(c.name)}</h3><button class="btn ghost" onclick="closeModal()">✕</button></div><div class="mb"><div class="form">
 ${isS?`<label class="fld full"><span>Operator / contractor *</span><select id="eqU"><option value="">SDC</option>${S.subs.map(s=>`<option value="${s.id}" ${e.subId===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></label>`:''}
 ${c.fields.map(k=>{const f=EQ_F[k],v=e[k]!==undefined?e[k]:(f.def==='today'?iso(TODAY()):'');const r=f.req?' <b class="req">*</b>':'';
  return f.t==='sel'?`<label class="fld"><span>${esc(f.l)}</span><select id="eq_${k}"><option value="">Select…</option>${f.o.map(o=>`<option ${v===o?'selected':''}>${o}</option>`).join('')}</select></label>`
  :`<label class="fld ${f.w==='full'?'full':''}"><span>${esc(f.l)}${r}</span><input id="eq_${k}" type="${f.t||'text'}" value="${esc(v)}" ${k==='desc'?`placeholder="${esc(c.ph)}"`:''}></label>`}).join('')}
 ${c.thorough?`<p class="pnote" style="grid-column:1/-1">All lifting equipment must be thoroughly examined at no greater intervals than: <b>6 months</b> for equipment used for lifting persons and for any lifting accessory, and <b>12 months</b> for all other lifting equipment. If paperwork is out of date or missing it cannot be used.</p>`:''}
 <label class="fld full"><span>Certificate / photo</span><input type="file" id="eq_file" accept="image/*,.pdf">${e.file?`<small>Current: ${fieldVal({t:'file'},e.file)}</small>`:''}</label></div></div>
 <div class="mf">${id?`<button class="btn bad" style="margin-right:auto" onclick="if(confirm('Delete from the register?')){S.eq=S.eq.filter(x=>x.id!=='${id}');save();closeModal();render()}">Delete</button>`:''}<button class="btn" onclick="closeModal()">Cancel</button><button class="btn pri" onclick="eqSave('${cls}','${id||''}')">Save</button></div>`,true)}
async function eqSave(cls,id){const c=EQ_CLS[cls];let e=id?S.eq.find(x=>x.id===id):null;const v={};
 for(const k of c.fields){v[k]=$('eq_'+k).value.trim();if(EQ_F[k].req&&!v[k])return toast(EQ_F[k].l+' is required','err')}
 if(v.offDate&&v.onDate&&v.offDate<v.onDate)return toast('Date off site is before date on site','err');
 if(!e){e={id:uid(),cls,ref:eqNo(cls),added:iso(TODAY()),by:U.name};S.eq.push(e)}
 e.subId=U.kind==='sub'?U.subId:$('eqU').value;Object.assign(e,v);
 const fl=$('eq_file').files[0];if(fl)e.file={name:fl.name,data:fl.type.startsWith('image/')?await shrinkImg(fl):await fileToData(fl)};
 if(U.kind==='sub'&&!id)notify('sdc',`${sub(U.subId).name} added ${c.short.toLowerCase()} "${e.desc}" to the ${c.name} register`,eqGo(cls),c.icon);
 audit(`${c.name} register – ${id?'updated':'added'} ${e.ref} ${e.desc}`);save();closeModal();if(KIOSK){renderKiosk();openInsp(cls)}else render();toast('Saved to register')}

 const c=EQ_CLS[cls],isS=U.kind==='sdc';subId=U.kind==='sub'?U.subId:(subId||'');
 const items=S.eq.filter(e=>e.cls===cls&&eqOn(e)&&(isS&&!subId?true:e.subId===subId));
 const now=new Date();const tm=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
 openModal(`<div class="mh"><h3>${c.icon} ${esc(c.insp)}</h3><button class="btn ghost" onclick="closeModal()">✕</button></div><div class="mb rs">
 <div class="rs-head"><img src="${LOGO}"><div style="flex:1"><h2>${esc(cls==='lift'?'Lifting Equipment & Accessories – Weekly Inspection':c.insp)}</h2><div class="small mut">${cls==='lift'?'BPS-XX-FM-HS-LO-006-R.01':cls==='puwer'?'Plant & work equipment – BPS-XX-FM-HS-PWE-001-R.03':'Weekly check'} · ${esc(S.project.name)}</div></div></div>
 ${isS?`<label class="fld" style="max-width:360px;margin-bottom:10px"><span>Operator / contractor</span><select onchange="closeModal();openInsp('${cls}',this.value)"><option value="">All (SDC inspection)</option>${S.subs.map(s=>`<option value="${s.id}" ${subId===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></label>`:''}
 ${c.photoReq?`<div class="pnote" style="margin-bottom:10px">📸 A photo of each ${c.short.toLowerCase()} tag is required for this weekly check.</div>`:''}
 ${items.length?`<div class="tbl-wrap"><table id="inT"><tr><th>Description of equipment</th><th>ID / reg mark</th><th>Operator / contractor</th><th>Result of inspection</th><th>Notes / defects</th><th>${esc(c.photoL)}${c.photoReq?' *':''}</th></tr>

 if(L==='twinsp'){const its=S.tw.filter(t=>twLive(t)&&subOn(t.subId));if(!its.length)return {st:'none',last:'',next:'',n:0,by:'No live temporary works',go:"F.twt='insp';go('tw')"};

/* ---------------- status engine ---------------- */
const ST={overdue:['Overdue','red'],due:['Due ≤ 7 days','amber'],indate:['In date','green'],review:['Awaiting SDC review','blue'],
 awaitsub:['Review issued – awaiting sub response','amber'],disputed:['Disputed by subcontractor','red'],
 rejected:['Revise & resubmit','red'],completed:['Completed','grey'],notonsite:['Not on site','purple'],asreq:['As required','grey'],
 missing:['Missing','red'],expiring:['Expiring ≤ 30 days','amber'],defect:['Defect reported','red'],daily:['Daily / as required','grey'],expired:['Expired','red'],none:['Not applicable','grey'],
 pending:['Sent – awaiting sign-off','amber'],complete:['Signed off','green'],resign:['Re-sign – RAMS revised','red'],cancelled:['Cancelled','grey'],never:['Not yet recorded','red'],offsite:['Off site','grey'],draft:['Draft – not sent','grey'],plive:['Permit live','green'],pexpired:['Permit expired','red'],pclosed:['Closed','grey']};
const RANK=['missing','pexpired','overdue','never','expired','disputed','rejected','defect','resign','due','expiring','awaitsub','pending','review','plive','indate','complete','draft','pclosed','asreq','daily','notonsite','completed','cancelled','none'];
const worst=a=>a.length?a.slice().sort((x,y)=>RANK.indexOf(x)-RANK.indexOf(y))[0]:'none';
const pill=(st,txt)=>{const s=ST[st]||[st,'grey'];return `<span class="pill p-${s[1]}">${txt||s[0]}</span>`};
function dueStatus(n,win=7){if(!n)return 'asreq';const k=daysTo(n);return k<0?'overdue':k<=win?'due':'indate'}
const sub=id=>S.subs.find(s=>s.id===id);
function effFlag(d){const s=sub(d.subId);return d.siteFlag||(s&&s.site!=='on site'?s.site:'')}
function docStatus(d){
 if(isPermit(d)){const ps=permitStatus(d);return ps==='pclosed'||ps==='cancelled'?'completed':ps}
 const f=effFlag(d);
 if(f==='completed')return 'completed'; if(f==='not on site')return 'notonsite';
 if(d.status==='submitted')return 'review';

/* signature pads */
function initSig(id){const c=$(id);if(!c)return;const r=c.getBoundingClientRect(),k=window.devicePixelRatio||1;c.width=r.width*k;c.height=r.height*k;const x=c.getContext('2d');x.scale(k,k);x.lineWidth=2.4;x.lineCap='round';x.strokeStyle='#0a2a55';let on=false;c._dirty=false;
 const p=e=>{const b=c.getBoundingClientRect();return [e.clientX-b.left,e.clientY-b.top]};
 c.onpointerdown=e=>{on=true;try{c.setPointerCapture(e.pointerId)}catch(_){};x.beginPath();x.moveTo(...p(e))};
 c.onpointermove=e=>{if(!on)return;x.lineTo(...p(e));x.stroke();c._dirty=true};
 c.onpointerup=()=>on=false}
function clearSig(id){const c=$(id);c.getContext('2d').clearRect(0,0,c.width,c.height);c._dirty=false}

/* ---------- document viewer ---------- */
function fieldVal(f,v){if(v==null||v===''||(Array.isArray(v)&&!v.length))return '<span class="mut">—</span>';if(f.t==='checks')return v.map(x=>`<span class="tag" style="margin:0 4px 4px 0">${esc(x)}</span>`).join('');if(f.t==='date')return fmt(v);if(f.t==='declare')return v?'✅ Confirmed':'—';if(f.t==='file')return v.data?`<a href="${v.data}" download="${esc(v.name)}">📎 ${esc(v.name)}</a>`:`📎 ${esc(v.name)} <span class="mut small">(file name only – file over 700 KB, keep the original on SharePoint)</span>`;return esc(v)}
function stepsFor(d){
 const names=['Uploaded','SDC review sheet','Sub accepts / denies','Status A – live','6-weekly reviews'];
 const cur={submitted:1,disputed:1,issued:2,actions:0,rejected:0}[d.status]??4;
 return `<div class="steps" style="margin-bottom:14px">${names.map((x,i)=>`<span class="step ${i<cur?'done':i===cur?'cur':''}">${x}</span>`).join('')}</div>`;
}
function openDoc(id){
 const d=S.docs.find(x=>x.id===id);if(!d)return;if(isPermit(d))return openPermit(id);
 const s=sub(d.subId),t=T(d.type),st=docStatus(d),isS=U.kind==='sdc';
 const fields=FORMS[d.type]||[];
 const signedOps=d.type==='ssow'?S.invites.filter(i=>i.completed&&(i.rams||[]).some(r=>r.docId===d.id)):[];
 const lastSub=(d.comments||[]).filter(c=>!c.sdc).slice(-1)[0];
 let actions='';
 if(isS){
  if(t.sheet&&needsSdc(d))actions+=`<button class="btn pri" onclick="openReviewSheet('${d.id}')">📝 ${d.status==='disputed'?'Revise & re-issue review sheet':'Complete SDC review sheet'}</button>`;
  else if(t.approval&&!t.sheet&&d.status==='submitted')actions+=`<button class="btn bad" onclick="decide('${d.id}','C')">C – Reject</button><button class="btn warn" onclick="decide('${d.id}','B')">B – Approve with comments</button><button class="btn ok" onclick="decide('${d.id}','A')">A – Approve</button>`;
  if(!t.approval&&d.status!=='acknowledged')actions+=`<button class="btn ok" onclick="ack('${d.id}')">✔ Acknowledge</button>`;
  if(t.sheet&&d.status==='approved'&&isActive(d))actions+=`<button class="btn" onclick="periodicReview('${d.id}')">🔁 Record 6-weekly review</button>`;
  if(['approved','acknowledged','logged'].includes(d.status)&&isActive(d))actions+=`<button class="btn" onclick="requestUpdate('${d.id}')">✉️ Request update</button>`;
 }else{
  if(d.status==='issued')actions+=`<button class="btn bad" onclick="respondReview('${d.id}',false)">✖ Deny review</button><button class="btn ok" onclick="respondReview('${d.id}',true)">✔ Accept review</button>`;
  else if(d.status!=='submitted'&&d.status!=='disputed'){
   if(d.type==='ssow'&&approvedVersion(d))actions+=`<button class="btn" onclick="closeModal();openSendInduct(['${d.id}'])">🎬 Send to operatives</button>`;
   actions+=`<button class="btn pri" onclick="openForm('${d.type}','${d.id}')">${t.approval?'Upload new revision':'Log new inspection'}</button>`;}
 }
 if(d.review)actions=`<button class="btn" onclick="printReview('${d.id}')">🖨️ Print review form</button>`+actions;
 openModal(`<div class="mh"><span style="font-size:24px">${t.icon}</span><h3>${esc(s.name)} – ${esc(d.title)} ${d.rev?`<span class="tag">Rev ${esc(d.rev)}</span>`:''}</h3>${pill(st)}<button class="btn ghost" onclick="closeModal()">✕</button></div>
 <div class="mb">${t.sheet?stepsFor(d):''}
  ${!isS&&d.status==='issued'?`<div class="card" style="background:#fff7e0;border-color:#f1d27a;margin-bottom:14px">📝 SDC has completed the review sheet below and given <b>Status ${esc(d.code)}</b>. Read every comment, then <b>Accept</b> or <b>Deny</b> at the bottom.</div>`:''}
  ${!isS&&d.status==='actions'?`<div class="card" style="background:#fde8e7;border-color:#f6c2bf;margin-bottom:14px">You accepted Status ${esc(d.code)}. Incorporate every SDC comment and upload a new revision.</div>`:''}
  ${isS&&d.status==='disputed'&&lastSub?`<div class="card" style="background:#fde8e7;border-color:#f6c2bf;margin-bottom:14px"><b>${esc(s.name)} denied the review:</b><br>${esc(lastSub.text)}</div>`:''}
  ${d.review&&['issued','actions','disputed','approved'].includes(d.status)?reviewReadonly(d):''}
  <dl class="dl" style="margin-top:14px"><dt>Document type</dt><dd>${esc(t.name)}</dd><dt>Submitted</dt><dd>${fmt(d.submitted)}</dd>
  ${t.approval?`<dt>Last SDC review</dt><dd>${fmt(d.reviewed)} ${d.reviewer?'by '+esc(d.reviewer):''} ${d.code?`<span class="tag">Status ${d.code}</span>`:''}</dd>`:''}
  <dt>${t.expiry?'Expiry':'Next review / due'}</dt><dd>${fmt(d.nextDue)} ${d.nextDue?'· '+dueText(d.nextDue):''}</dd>${d.src?`<dt>Source</dt><dd class="mut">${esc(d.src)}</dd>`:''}
  ${d.type==='ssow'?`<dt>Signed by operatives</dt><dd>${signedOps.length?signedOps.map(i=>`${esc(i.opName)} (Rev ${esc(i.rams.find(r=>r.docId===d.id).rev)}, ${fmt(i.completed)})`).join(', '):'<span class="mut">None yet</span>'}</dd>`:''}</dl>
  <h4 style="margin:18px 0 8px">Submitted information</h4>
  <dl class="dl">${fields.filter(f=>d.data[f.k]!==undefined).map(f=>`<dt>${esc(f.l.replace(/\.$/,''))}</dt><dd>${fieldVal(f,d.data[f.k])}</dd>`).join('')||'<dd class="mut">Imported record – no form data. Ask the subcontractor to upload the current version via the portal.</dd>'}</dl>
  ${d.comments.length?`<h4 style="margin:18px 0 8px">Comments & responses</h4><div class="thread">${d.comments.map(c=>`<div class="msg ${c.sdc===isS?'me':''}"><div class="who">${esc(c.by)} · ${new Date(c.t).toLocaleString('en-GB')} ${c.code?'· Status '+c.code:''}</div>${esc(c.text)}</div>`).join('')}</div>`:''}
  ${t.sheet&&(d.reviewLog.length||d.periodic.length)?trackingTables(d):''}
 </div>
 <div class="mf">${actions}<button class="btn" onclick="closeModal()">Close</button></div>`,true);
}
function trackingTables(d){
 return `<h4 style="margin:18px 0 8px">Review tracking</h4><div class="tbl-wrap"><table><tr><th>Rev</th><th>Stage</th><th>Status</th><th>Date received</th><th>Date sent</th><th>Reviewer</th><th>Sub response</th></tr>
 ${d.reviewLog.map(l=>`<tr><td>${esc(l.rev)}</td><td>${esc(l.stage||'')}</td><td><span class="tag">${esc(l.status)}</span></td><td>${fmt(l.dateReceived)}</td><td>${fmt(l.dateSent)}</td><td>${esc(l.reviewer)}<div class="small mut">${esc(l.position||'')}</div></td><td>${l.accepted===true?'✅ Accepted '+fmt(l.respDate):l.accepted===false?'✖ Denied '+fmt(l.respDate):'—'}</td></tr>`).join('')}</table></div>
 <h4 style="margin:14px 0 8px">System of Work review dates (at least every 6 weeks)</h4><div class="tbl-wrap"><table><tr><th>Name</th><th>Position</th><th>Signature</th><th>Date</th><th>Notes</th></tr>
 ${d.periodic.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.position)}</td><td>${p.sig?`<img src="${p.sig}" style="height:34px">`:'—'}</td><td>${fmt(p.date)}</td><td class="small">${esc(p.notes)}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">No 6-weekly reviews recorded yet</td></tr>'}</table></div>`;
}

/* ---------- SDC SoW review sheet ---------- */
function openReviewSheet(id){
 const d=S.docs.find(x=>x.id===id),s=sub(d.subId);
 const prev=d.review||{};const items=prev.items||{};
 const ref=prev.ref||('SoW-'+S.project.number+'-'+String(S.docs.filter(x=>x.review).length+1).padStart(3,'0'));
 const nd=addDays(iso(TODAY()),S.freq.ssow||42);
 const row=(k,txt)=>{const v=(items[k]||{}).v||'',c=(items[k]||{}).c||'';return `<tr><td class="it">${esc(txt)}</td><td style="white-space:nowrap"><span class="yn">${['Y','N','NA'].map(o=>`<label><input type="radio" name="rs_${k}" value="${o}" ${v===o?'checked':''} onchange="rsCount()">${o==='Y'?'Yes':o==='N'?'No':'N/A'}</label>`).join('')}</span></td><td><input class="c" id="rc_${k}" value="${esc(c)}" placeholder="Comment"></td></tr>`};
 openModal(`<div class="mh"><h3>📝 Contractor SoW Review & Tracking Form – ${esc(s.name)}</h3><span class="tag">Rev ${esc(d.rev)}</span><span class="small mut" id="rsCnt"></span><button class="btn ghost" onclick="closeModal()">✕</button></div>
 <div class="mb rs">
  <div class="rs-head"><img src="${LOGO}" alt="SDC"><div style="flex:1"><h2>Contractor SoW Review & Tracking Form</h2><div class="small mut">${RS_FORMREF}</div></div><label class="fld" style="width:220px"><span>Reference number</span><input id="rsRef" value="${esc(ref)}"></label></div>
  ${d.status==='disputed'?`<div class="card" style="background:#fde8e7;border-color:#f6c2bf;margin-bottom:12px"><b>Subcontractor's reason for denying:</b> ${esc(((d.comments||[]).filter(c=>!c.sdc).slice(-1)[0]||{}).text||'')}</div>`:''}
  <div class="form" style="grid-template-columns:repeat(4,1fr);margin-bottom:14px">
   <label class="fld"><span>Project</span><input id="rsP" value="${esc(prev.project||S.project.name+' ('+S.project.number+')')}"></label>
   <label class="fld"><span>Contractor</span><input id="rsC" value="${esc(s.name)}"></label>
   <label class="fld"><span>System of Work title</span><input id="rsT" value="${esc(d.title)}"></label>
   <label class="fld"><span>Category classification</span><select id="rsCat">${['A','B'].map(x=>`<option ${(prev.category||d.data.category||'A')===x?'selected':''}>${x}</option>`).join('')}</select></label>
   <label class="fld"><span>Date prepared</span><input type="date" id="rsDP" value="${esc(prev.datePrepared||d.data.prepared||'')}"></label>
   <label class="fld"><span>Date issued to SDC</span><input type="date" id="rsDI" value="${esc(d.submitted)}"></label>
   <label class="fld"><span>Proposed commencement date</span><input type="date" id="rsCD" value="${esc(prev.commence||d.data.start||'')}"></label>
   <div class="fld"><span>RAMS document</span><div style="padding-top:8px">${d.data.file?fieldVal({t:'file'},d.data.file):'<span class="mut small">Form data only</span>'} <a href="#" onclick="openDocInfo('${d.id}');return false" class="small">View submission</a></div></div>
  </div>
  <div class="toolbar"><span class="small mut">Tip: use the quick buttons on each section heading, then change individual answers.</span></div>
  <div class="tbl-wrap"><table>${RS.map((sec,si)=>`<tr class="sh"><td colspan="3" style="display:table-cell"><div style="display:flex;align-items:center;gap:8px">${esc(sec.s)}<span style="flex:1"></span><button class="btn sm" onclick="rsAll(${si},'Y')">All Yes</button><button class="btn sm" onclick="rsAll(${si},'NA')">All N/A</button></div></td></tr><tr><th>Item</th><th>Yes / No / N/A</th><th>Comments</th></tr>`+sec.i.map((txt,ii)=>row(si+'_'+ii,txt)).join('')).join('')}</table></div>
  <h4 style="margin:18px 0 8px">Status</h4>
  <div class="stat">${['A','B','C'].map(c=>`<label><input type="radio" name="rsStat" value="${c}" ${prev.status===c&&d.status!=='disputed'?'checked':''}><b>${c}</b>${esc(RS_STATUS[c])}</label>`).join('')}</div>
  <label class="fld full" style="margin-top:12px"><span>Site Manager comments to subcontractor</span><textarea id="rsCom" rows="3">${esc(prev.comments||'')}</textarea></label>
  <p class="rednote">${esc(RS_NOTE)}</p>
  <h4 style="margin:18px 0 8px">Review details</h4>
  <div class="form" style="grid-template-columns:repeat(4,1fr)"><label class="fld"><span>Name</span><input id="rsN" value="${esc(U.name)}"></label><label class="fld"><span>Position</span><input id="rsPos" value="${esc(U.role||'Site Manager')}"></label>
  <label class="fld"><span>Date</span><input type="date" id="rsD" value="${iso(TODAY())}"></label><label class="fld"><span>Next review date (if Status A)</span><input type="date" id="rsNext" value="${nd}"></label></div>
  <p class="small mut" style="margin:12px 0 6px">Signature</p><canvas id="rsSig" class="sigpad" style="max-width:460px"></canvas><button class="btn sm" style="margin-top:6px" onclick="clearSig('rsSig')">Clear signature</button>
 </div>
 <div class="mf"><span class="small mut" style="margin-right:auto">Issuing sends a 🔔 notification to ${esc(s.name)} to accept or deny.</span><button class="btn" onclick="closeModal()">Cancel</button><button class="btn pri" onclick="issueReview('${d.id}')">Issue review to subcontractor</button></div>`,2);
 initSig('rsSig');rsCount();

function openDocInfo(id){const d=S.docs.find(x=>x.id===id);const w=window.open('','_blank');if(!w)return;w.document.write(`<title>${esc(d.title)}</title><body style="font-family:Segoe UI,Arial;padding:24px"><h2>${esc(sub(d.subId).name)} – ${esc(d.title)} Rev ${esc(d.rev)}</h2><dl>${FORMS.ssow.filter(f=>d.data[f.k]!==undefined).map(f=>`<dt><b>${esc(f.l)}</b></dt><dd style="margin:0 0 10px">${fieldVal(f,d.data[f.k])}</dd>`).join('')}</dl></body>`)}
function rsAll(si,v){RS[si].i.forEach((_,ii)=>{const r=document.querySelector(`input[name="rs_${si}_${ii}"][value="${v}"]`);if(r)r.checked=true});rsCount()}
function rsCount(){const a=RS_KEYS.filter(k=>document.querySelector(`input[name="rs_${k}"]:checked`)).length;const n=RS_KEYS.filter(k=>document.querySelector(`input[name="rs_${k}"][value=N]:checked`)).length;const el=$('rsCnt');if(el)el.innerHTML=`${a}/${RS_KEYS.length} answered · <b style="color:${n?'var(--red)':'inherit'}">${n} No</b>`}
function issueReview(id){
 const d=S.docs.find(x=>x.id===id),s=sub(d.subId);
 const items={};let miss=0,noC=0,nos=0;
 RS_KEYS.forEach(k=>{const r=document.querySelector(`input[name="rs_${k}"]:checked`);const c=$('rc_'+k).value.trim();if(!r)miss++;else{if(r.value==='N'){nos++;if(!c)noC++}}items[k]={v:r?r.value:'',c}});
 const stat=(document.querySelector('input[name=rsStat]:checked')||{}).value;
 if(miss)return toast(`${miss} item(s) not answered – mark Yes, No or N/A`,'err');
 if(noC)return toast(`Add a comment against every item marked "No" (${noC} missing)`,'err');
 if(!stat)return toast('Choose Status A, B or C','err');
 if(stat==='A'&&nos)return toast(`${nos} item(s) marked "No" – Status A not allowed. Use B or C.`,'err');
 if(stat!=='A'&&!$('rsCom').value.trim()&&!nos)return toast('Add comments explaining what must change','err');
 if(!signed('rsSig'))return toast('Sign the review','err');
 const round=(d.review&&d.review.rev===d.rev?(d.review.round||1)+1:1);
 d.review={ref:$('rsRef').value,project:$('rsP').value,contractor:$('rsC').value,title:$('rsT').value,category:$('rsCat').value,datePrepared:$('rsDP').value,dateIssued:$('rsDI').value,commence:$('rsCD').value,
  items,status:stat,comments:$('rsCom').value.trim(),reviewer:$('rsN').value,position:$('rsPos').value,sig:$('rsSig').toDataURL('image/png'),date:$('rsD').value,nextDue:$('rsNext').value,round,rev:d.rev};
 d.status='issued';d.code=stat;d.reviewer=d.review.reviewer;d.reviewed=d.review.date;
 d.reviewLog.push({rev:d.rev,status:stat,dateReceived:d.submitted,dateSent:d.review.date,reviewer:d.review.reviewer,position:d.review.position,date:d.review.date,stage:round>1?'Re-issued after dispute':(d.reviewLog.some(l=>l.rev!==d.rev)?'Resubmission review':'Initial review')});
 d.comments.push({by:U.name,sdc:1,t:new Date().toISOString(),code:stat,text:`SoW review issued – Status ${stat}${nos?` (${nos} item${nos>1?'s':''} marked No)`:''}.${d.review.comments?' '+d.review.comments:''}`});
 notify(d.subId,`SDC issued the SoW review for "${d.title}" Rev ${d.rev} – Status ${stat}. Please accept or deny.`,`openDoc('${d.id}')`,'📝');
 S.msgs.push({id:uid(),subId:d.subId,from:U.name,fromSdc:true,date:new Date().toISOString(),text:`SoW review for ${d.title} Rev ${d.rev}: Status ${stat}. Open "SDC reviews" to read the full review sheet and accept or deny.`});
 S.notes.filter(n=>n.to==='sdc'&&n.act.includes(d.id)).forEach(n=>n.read=true);
 audit(`SoW review issued – ${s.name} – ${d.title} Rev ${d.rev} – Status ${stat}`);save();closeModal();render();toast(`Review issued – ${s.name} notified`);
 if(s.email&&confirm(`Also email ${s.name} (${s.email})?`))mailto(s.email,`${S.project.name} – SoW review: ${d.title} Rev ${d.rev} – Status ${stat}`,`Hi,\n\nSDC has reviewed ${d.title} Rev ${d.rev} – Status ${stat}.\n${RS_STATUS[stat]}\n\n${d.review.comments}\n\nPlease log in to the SDC Supply Chain Portal to read the full review sheet and accept or deny it.\n\nThanks,\n${U.name}`);
}
function reviewReadonly(d){
 const r=d.review,s=sub(d.subId);
 const flagged=RS.flatMap((sec,si)=>sec.i.map((txt,ii)=>({k:si+'_'+ii,txt,sec:sec.s}))).filter(x=>r.items[x.k]&&(r.items[x.k].v==='N'||r.items[x.k].c));
 return `<div class="card rs" style="padding:16px;border-color:#b9d3f1"><div class="rs-head"><img src="${LOGO}" alt="SDC"><div style="flex:1"><h2>Contractor SoW Review & Tracking Form</h2><div class="small mut">Ref ${esc(r.ref)} · ${RS_FORMREF}</div></div><div style="text-align:center"><div class="small mut">Status</div><div style="font-size:34px;font-weight:800;color:${r.status==='A'?'var(--green)':r.status==='B'?'var(--amber)':'var(--red)'}">${esc(r.status)}</div></div></div>
 <dl class="dl" style="grid-template-columns:170px 1fr 170px 1fr"><dt>Project</dt><dd>${esc(r.project)}</dd><dt>Contractor</dt><dd>${esc(r.contractor)}</dd><dt>System of Work</dt><dd>${esc(r.title)} (Rev ${esc(r.rev||d.rev)})</dd><dt>Category</dt><dd>${esc(r.category)}</dd>
 <dt>Date prepared</dt><dd>${fmt(r.datePrepared)}</dd><dt>Date issued to SDC</dt><dd>${fmt(r.dateIssued)}</dd><dt>Proposed commencement</dt><dd>${fmt(r.commence)}</dd><dt>Reviewed by</dt><dd>${esc(r.reviewer)}, ${esc(r.position)} – ${fmt(r.date)}</dd></dl>
 <p style="margin:12px 0 6px"><b>Status ${esc(r.status)}:</b> ${esc(RS_STATUS[r.status])}</p>
 ${r.comments?`<p style="margin:0 0 10px"><b>Site Manager comments:</b> ${esc(r.comments)}</p>`:''}
 ${flagged.length?`<h4 style="margin:12px 0 6px">Items needing your attention</h4><div class="tbl-wrap"><table>${flagged.map(x=>`<tr><td style="width:70px"><span class="ans ${r.items[x.k].v}">${r.items[x.k].v==='NA'?'N/A':r.items[x.k].v==='Y'?'Yes':'No'}</span></td><td><b>${esc(x.txt)}</b><div class="small mut">${esc(x.sec)}</div></td><td>${esc(r.items[x.k].c)}</td></tr>`).join('')}</table></div>`:''}
 <details style="margin-top:10px"><summary style="cursor:pointer;font-weight:600;color:var(--navy2)">Show the full review sheet (${RS_KEYS.length} items)</summary>
 <div class="tbl-wrap" style="margin-top:8px"><table>${RS.map((sec,si)=>`<tr class="sh"><td colspan="3">${esc(sec.s)}</td></tr>`+sec.i.map((txt,ii)=>{const it=r.items[si+'_'+ii]||{};return `<tr><td class="it">${esc(txt)}</td><td><span class="ans ${it.v||'x'}">${it.v==='NA'?'N/A':it.v==='Y'?'Yes':it.v==='N'?'No':'–'}</span></td><td class="small">${esc(it.c||'')}</td></tr>`}).join('')).join('')}</table></div></details>
 <p class="rednote" style="margin-top:12px">${esc(RS_NOTE)}</p>
 ${r.sig?`<div class="small mut">Signed: <img src="${r.sig}" style="height:40px;vertical-align:middle;border:1px solid var(--line);border-radius:6px;background:#fff"></div>`:''}
 ${r.subResponse?`<div style="margin-top:8px" class="small">${r.subResponse.accepted?'✅ Accepted':'✖ Denied'} by ${esc(r.subResponse.name)} (${esc(r.subResponse.position)}) on ${fmt(r.subResponse.date)}${r.subResponse.reason?' – '+esc(r.subResponse.reason):''}</div>`:''}</div>`;
}
/* ---------- subcontractor accept / deny ---------- */
function respondReview(id,accept){
 const d=S.docs.find(x=>x.id===id),r=d.review;
 const consequence=accept?(r.status==='A'?'Your RAMS becomes live (Status A achieved). You can then send it to operatives with the induction pack.':r.status==='B'?'You agree to incorporate every SDC comment. You will then need to upload a new revision for Status A.':'You agree the SoW is not accepted. You will need to resubmit a new revision.'):'SDC will be notified straight away and must review your reasons before re-issuing.';
 openModal(`<div class="mh"><h3>${accept?'✔ Accept':'✖ Deny'} SDC review – ${esc(d.title)} Rev ${esc(d.rev)} (Status ${esc(r.status)})</h3><button class="btn ghost" onclick="closeModal()">✕</button></div><div class="mb">
 <div class="card" style="margin-bottom:12px;background:${accept?'#e3f5ea':'#fde8e7'};border:0">${esc(consequence)}</div>
 <div class="form"><label class="fld"><span>Your name *</span><input id="rrN"></label><label class="fld"><span>Position *</span><input id="rrP" placeholder="e.g. Contracts Manager"></label>
 <label class="fld full"><span>${accept?'Comments (optional)':'Reason for denying – which items and why *'}</span><textarea id="rrR" rows="4" placeholder="${accept?'':'e.g. Item 3.4 – ladder RA is in Appendix C of the RAMS, page 14.'}"></textarea></label></div>
 <p class="small mut" style="margin:12px 0 6px">Signature *</p><canvas id="rrSig" class="sigpad"></canvas><button class="btn sm" style="margin-top:6px" onclick="clearSig('rrSig')">Clear</button></div>
 <div class="mf"><button class="btn" onclick="closeModal();openDoc('${d.id}')">Back</button><button class="btn ${accept?'ok':'bad'}" onclick="submitResponse('${d.id}',${accept})">${accept?'Accept review':'Deny & send back to SDC'}</button></div>`);
 initSig('rrSig');
}
function submitResponse(id,accept){
 const d=S.docs.find(x=>x.id===id),r=d.review,s=sub(d.subId);
 const n=$('rrN').value.trim(),p=$('rrP').value.trim(),reason=$('rrR').value.trim();
 if(!n||!p)return toast('Add your name and position','err');
 if(!accept&&!reason)return toast('Explain why you are denying the review','err');
 if(!signed('rrSig'))return toast('Please sign','err');
 r.subResponse={accepted:accept,name:n,position:p,reason,date:iso(TODAY()),sig:$('rrSig').toDataURL('image/png')};
 const log=d.reviewLog.slice().reverse().find(l=>l.rev===d.rev&&l.accepted===undefined);if(log){log.accepted=accept;log.respDate=iso(TODAY())}
 d.comments.push({by:`${n} (${s.name})`,sdc:0,t:new Date().toISOString(),text:(accept?'Accepted SDC review':'DENIED SDC review')+(reason?': '+reason:'')});
 let msg;
 if(!accept){d.status='disputed';msg=`${s.name} DENIED the review of "${d.title}" Rev ${d.rev}: ${reason}`;notify('sdc',msg,`openDoc('${d.id}')`,'⚠️')}
 else if(r.status==='A'){d.status='approved';d.nextDue=r.nextDue;d.reviewLog.push({rev:d.rev,status:'A',dateReceived:d.submitted,dateSent:r.date,reviewer:r.reviewer,position:r.position,date:iso(TODAY()),stage:'Status A achieved',accepted:true,respDate:iso(TODAY())});
  msg=`${s.name} accepted Status A for "${d.title}" Rev ${d.rev} – RAMS now live (next review ${fmt(r.nextDue)})`;notify('sdc',msg,`openDoc('${d.id}')`,'✅');
  const rs=S.invites.filter(i=>i.subId===d.subId&&inviteState(i)==='resign').length;if(rs)notify(d.subId,`${rs} operative(s) signed an older revision of "${d.title}" – re-send the induction pack`,"go('sinduct')",'🎬')}
 else{d.status='actions';msg=`${s.name} accepted Status ${r.status} for "${d.title}" Rev ${d.rev} – revision to follow`;notify('sdc',msg,`openDoc('${d.id}')`,'📨')}
 S.notes.filter(x=>x.to===d.subId&&x.act.includes(d.id)).forEach(x=>x.read=true);
 audit(msg,n);save();closeModal();render();toast(accept?'Response sent to SDC':'Dispute sent to SDC');
 if(accept&&r.status!=='A'&&confirm('Upload the revised RAMS now?'))openForm('ssow',d.id);
}

function decide(id,code){
 const d=S.docs.find(x=>x.id===id),c=prompt(code==='A'?'Comment (optional)':'Comment to subcontractor (required)')||'';
 if(code!=='A'&&!c.trim())return toast('Add a comment for Status '+code,'err');
 const t=T(d.type);d.code=code;d.reviewer=U.name;d.reviewed=iso(TODAY());
 if(code==='C'){d.status='rejected'}else{d.status='approved';d.nextDue=t.expiry?(d.data.expiry||d.nextDue):addDays(iso(TODAY()),S.freq[d.type]||t.freq||365)}
 const label={A:'Approved',B:'Approved with comments',C:'Rejected – revise and resubmit'}[code];
 d.comments.push({by:U.name,sdc:1,t:new Date().toISOString(),code,text:label+(c?': '+c:'')});
 notify(d.subId,`SDC ${label.toLowerCase()}: "${d.title}"`,`openDoc('${d.id}')`,code==='C'?'⚠️':'✅');
 audit(`Status ${code} – ${sub(d.subId).name} – ${d.title}`);save();closeModal();render();toast(`${label} – subcontractor notified`);
}

function remind(subId){
 const s=sub(subId),c=compliance(subId);
 const docs=S.docs.filter(d=>d.subId===subId&&['overdue','due','rejected','defect','awaitsub'].includes(docStatus(d)));
 const lines=docs.map(d=>`- ${d.title} (${T(d.type).name}) – ${isPermit(d)?d.permit.no+' '+permitStageText(d):d.status==='issued'?'SDC review waiting for your acceptance':['rejected','actions'].includes(d.status)?'revise and resubmit':dueText(d.nextDue)}`).concat(c.items.filter(i=>i.st==='missing').map(i=>`- ${i.label} – not yet provided`));
 S.msgs.push({id:uid(),subId,from:U.name,fromSdc:true,date:new Date().toISOString(),text:'Reminder – the following need your attention:\n'+(lines.join('\n')||'- No outstanding items')});
 notify(subId,`Reminder from SDC: ${lines.length} item(s) need your attention`,"go('sdash')",'⏰');

function aideInfo(a){
 {const x=aideLinked(a);if(x)return x}

  if(!ds.length)return {st:a.freqDays>1?'never':'asreq',last:'',next:'',n:0,by:'Sub-contractors (via portal)'};
  const last=ds.map(d=>d.reviewed||d.submitted).filter(Boolean).sort().slice(-1)[0];

}

/* =========================== PRE-SITE INDUCTIONS =========================== */
function approvedVersion(d){
 if(['approved','acknowledged'].includes(d.status))return {rev:d.rev,data:d.data,title:d.title};
 const h=(d.history||[]).slice().reverse().find(x=>['approved','acknowledged'].includes(x.status));
 return h?{rev:h.rev,data:h.data,title:d.title}:null;
}
function inviteState(i){
 if(i.cancelled)return 'cancelled';
 if(!i.completed)return 'pending';
 if(S.induction.validDays&&daysTo(addDays(i.completed,S.induction.validDays))<0)return 'expired';
 for(const r of i.rams||[]){const d=S.docs.find(x=>x.id===r.docId);const a=d&&approvedVersion(d);if(a&&a.rev!==r.rev)return 'resign'}
 return 'complete';
}
function inviteLink(i){return location.href.split('#')[0]+'#induct='+i.token}
function opInvite(o){return S.invites.filter(i=>i.opId===o.id&&!i.cancelled).sort((a,b)=>b.created.localeCompare(a.created))[0]}
function opInvitePill(o){const i=opInvite(o);return i?pill(inviteState(i)):pill('none','Not sent')}
function embedUrl(u){if(!u)return '';let m=u.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([\w-]{6,})/);if(m)return 'https://www.youtube.com/embed/'+m[1];
 m=u.match(/vimeo\.com\/(?:video\/)?(\d+)/);if(m)return 'https://player.vimeo.com/video/'+m[1];if(/\/embed|\.mp4$/i.test(u))return u;return ''}

function calEvents(){

}

function fieldHTML(f,val){

 if(val===undefined&&f.def==='today')val=iso(TODAY());
 switch(f.t){
  case 'textarea':return `<label class="fld full"><span>${esc(f.l)}${r}</span><textarea id="${id}" rows="3" placeholder="${esc(f.ph||'')}">${esc(val||'')}</textarea></label>`;
  case 'checks':return `<div class="fld full"><span>${esc(f.l)}${r}</span><div class="checks">${f.o.map(o=>`<label class="chk"><input type="checkbox" name="${id}" value="${esc(o)}" ${(val||[]).includes(o)?'checked':''}>${esc(o)}</label>`).join('')}</div></div>`;
  case 'select':return `<label class="fld"><span>${esc(f.l)}${r}</span><select id="${id}"><option value="">Select…</option>${f.o.map(o=>`<option ${val===o?'selected':''}>${esc(o)}</option>`).join('')}</select></label>`;

 }

async function submitForm(type,docId){
 const t=T(type),fields=FORMS[type],d=docId?S.docs.find(x=>x.id===docId):null,data={};
 for(const f of fields){const el=$('f_'+f.k);
  if(f.t==='checks')data[f.k]=[...document.querySelectorAll(`input[name="f_${f.k}"]:checked`)].map(x=>x.value);
  else if(f.t==='file'){const fl=el.files[0];data[f.k]=fl?{name:fl.name,size:fl.size,data:await fileToData(fl)}:(d&&t.approval?d.data[f.k]:undefined)}
  else if(f.t==='declare')data[f.k]=el.checked;
  else data[f.k]=el.value.trim();
  const v=data[f.k];if(f.req&&(!v||(Array.isArray(v)&&!v.length)))return toast(`"${f.l.slice(0,40)}" is required`,'err');}
 if(type==='ssow'&&data.start&&daysTo(data.start)<14&&!confirm(`Proposed start is ${daysTo(data.start)} days away – SDC asks for RAMS at least 14 days before starting. Work cannot start until Status A. Submit anyway?`))return;
 const title=t.titleKey?data[t.titleKey]:t.name;const today=iso(TODAY());
 let doc=d;
 if(!doc){doc={id:uid(),subId:U.subId,type,title,rev:'',status:'',history:[],comments:[],reviewLog:[],periodic:[],siteFlag:''};S.docs.push(doc)}
 else doc.history.push({rev:doc.rev,status:doc.status,code:doc.code,reviewed:doc.reviewed,reviewer:doc.reviewer,nextDue:doc.nextDue,data:doc.data,date:doc.submitted});
 doc.title=title;doc.data=data;doc.submitted=today;doc.sample=0;doc.siteFlag='';
 if(t.approval){doc.rev=d?nextRev(d.rev):'A';doc.status='submitted';if(t.expiry&&!d)doc.nextDue=data.expiry;
  const s=sub(U.subId);
  notify('sdc',`${s.name} uploaded "${title}" Rev ${doc.rev} – ${t.sheet?'SoW review':'review'} required${data.start?' (start '+fmt(data.start)+')':''}`,`openDoc('${doc.id}')`,'📥');}
 else{doc.status='logged';doc.reviewed=data.date;doc.nextDue=addDays(data.date,S.freq[type]||t.freq);doc.reviewer=''}
 if(data.result&&data.result.startsWith('Fail')){S.msgs.push({id:uid(),subId:U.subId,from:U.name,fromSdc:false,date:new Date().toISOString(),text:`⚠️ Failed inspection: ${title} – ${data.defects||''} Action: ${data.action||''}`});notify('sdc',`⚠️ ${U.name}: failed inspection – ${title}`,`openDoc('${doc.id}')`,'⚠️')}
 audit(`${t.approval?'Submitted':'Logged'} ${t.name} – ${title}${doc.rev?' Rev '+doc.rev:''}`);save();closeModal();go('sdocs');
 toast(t.approval?'Submitted – SDC has been notified to review it':'Saved – next due '+fmt(doc.nextDue));
 if(t.approval&&S.project.sdcEmail&&confirm(`Also email the SDC review team (${S.project.sdcEmail})?`))mailto(S.project.sdcEmail,`${S.project.name} – ${U.name} – ${title} Rev ${doc.rev} for review`,`Hi,\n\n${U.name} has uploaded ${title} Rev ${doc.rev} to the SDC Supply Chain Portal for review.${data.start?'\nProposed start: '+fmt(data.start):''}\n\nThanks`);
}
function vSOps(){
 const ops=S.ops.filter(o=>o.subId===U.subId);
 return `<div class="toolbar"><span class="mut">Register everyone working on site, then send them the pre-site induction pack.</span><span class="sp"></span><button class="btn" onclick="openSendInduct()">🎬 Send induction pack</button><button class="btn pri" onclick="editOp()">➕ Add operative</button></div>
 <div class="tbl-wrap"><table><tr><th>Name</th><th>Role</th><th>Card type</th><th>Card no.</th><th>Expiry</th><th>Other tickets</th><th>Pre-site (video + RAMS)</th><th>SDC induction</th><th>Card</th><th></th></tr>
 ${ops.map(o=>`<tr><td><b>${esc(o.name)}</b></td><td>${esc(o.role)}</td><td>${esc(o.cscsType)}</td><td>${esc(o.cscsNo)}</td><td>${fmt(o.cscsExpiry)}</td><td>${esc(o.certs)}</td><td>${opInvitePill(o)}</td><td>${o.inducted?'✅ '+fmt(o.inductionDate):'⏳ Pending'}</td><td>${pill(opStatus(o))}</td><td><button class="btn sm" onclick="editOp('${o.id}')">Edit</button></td></tr>`).join('')||'<tr><td colspan="10" class="empty">No operatives yet</td></tr>'}</table></div>`;
}
function editOp(id){
 const o=id?S.ops.find(x=>x.id===id):{name:'',role:'',cscsType:'',cscsNo:'',cscsExpiry:'',certs:'',email:'',phone:''};
 const canEdit=U.kind==='sub';
 openModal(`<div class="mh"><h3>👷 ${id?esc(o.name):'Add operative'}</h3><button class="btn ghost" onclick="closeModal()">✕</button></div><div class="mb"><div class="form">
 <label class="fld"><span>Full name *</span><input id="oN" value="${esc(o.name)}"></label><label class="fld"><span>Role / trade</span><input id="oR" value="${esc(o.role)}"></label>
 <label class="fld"><span>Email</span><input id="oEm" value="${esc(o.email||'')}"></label><label class="fld"><span>Mobile</span><input id="oPh" value="${esc(o.phone||'')}"></label>
 <label class="fld"><span>Card type</span><select id="oT">${CARDS.map(x=>`<option ${o.cscsType===x?'selected':''}>${x}</option>`).join('')}</select></label>
 <label class="fld"><span>Card number</span><input id="oNo" value="${esc(o.cscsNo)}"></label><label class="fld"><span>Card expiry *</span><input type="date" id="oE" value="${esc(o.cscsExpiry)}"></label>
 <label class="fld"><span>Other tickets (IPAF, PASMA, SMSTS…)</span><input id="oC" value="${esc(o.certs)}"></label></div></div>
 <div class="mf">${id&&canEdit?`<button class="btn bad" style="margin-right:auto" onclick="S.ops=S.ops.filter(x=>x.id!=='${id}');save();closeModal();render()">Remove</button>`:''}<button class="btn" onclick="closeModal()">Close</button>${canEdit?`<button class="btn pri" onclick="saveOp('${id||''}')">Save</button>`:''}</div>`);
}
function saveOp(id){const n=$('oN').value.trim(),e=$('oE').value;if(!n||!e)return toast('Name and card expiry required','err');let o=id?S.ops.find(x=>x.id===id):null;if(!o){o={id:uid(),subId:U.subId,inducted:false,inductionDate:''};S.ops.push(o)}Object.assign(o,{name:n,role:$('oR').value,email:$('oEm').value,phone:$('oPh').value,cscsType:$('oT').value,cscsNo:$('oNo').value,cscsExpiry:e,certs:$('oC').value,sample:0});audit(`${id?'Updated':'Added'} operative ${n}`);save();closeModal();render();toast('Saved')}
function vSMsgs(){S.msgs.filter(m=>m.subId===U.subId&&m.fromSdc).forEach(m=>m.readSub=1);save();return `<div class="card">${threadHTML(U.subId,false)}</div>`}
function vSProfile(){const s=sub(U.subId);return `<div class="card" style="max-width:640px"><h3>🏢 Company details</h3><div class="form">
 <label class="fld"><span>Company</span><input value="${esc(s.name)}" disabled></label><label class="fld"><span>Trade / package</span><input id="pT" value="${esc(s.trade)}"></label>
 <label class="fld"><span>Contact name</span><input id="pC" value="${esc(s.contact)}"></label><label class="fld"><span>Email</span><input id="pE" value="${esc(s.email)}"></label>
 <label class="fld"><span>Phone</span><input id="pP" value="${esc(s.phone)}"></label><label class="fld"><span>Change password (min 8 characters)</span><input id="pK" type="password" placeholder="Leave blank to keep"></label></div><br>
 <button class="btn pri" onclick="saveProfile()">Save</button></div>`}
function saveProfile(){const s=sub(U.subId);Object.assign(s,{trade:$('pT').value,contact:$('pC').value,email:$('pE').value,phone:$('pP').value});if($('pK').value){if($('pK').value.length<8)return toast('Password must be at least 8 characters','err');setPw(s,$('pK').value)}audit('Updated company profile');save();toast('Profile saved')}

/* ---------- boot ---------- */
function boot(){const m=location.hash.match(/^#induct=(\w+)/);if(m){return renderOperative(m[1])}if(location.hash==='#tablet'){if(!KIOSK)startKiosk();return}if(location.hash==='#safestart'){if(!KIOSK)startKiosk();if(KIOSK.step!=='pin'){KIOSK.step='safewho';renderKiosk()}else KIOSK.after='safewho';return}if(KIOSK){KIOSK=null;U=null}render();primeSeen()}
window.addEventListener('hashchange',boot);
boot();
save();
</script>
